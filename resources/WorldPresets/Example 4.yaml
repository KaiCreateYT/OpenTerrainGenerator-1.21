# WorldPreset: defines OTG dimensions for servers and modpacks.
# Use:
# Server: Place this file in WorldPresets/ to define your world configuration.
# Modpack: Name this file Modpack.yaml for auto-detection.
# Forge SP: Modpacks can use this config to lock the world creation GUI and use the settings in this config instead, so users can create a world with 1 click.
# - Rename this file to Modpack.yaml, OTG will automatically replace the world creation GUI with a locked custom world creation screen.
# For more information, see: https://openterraingen.fandom.com/wiki/Dimension_%26_Modpack_Configuration
#
# This config creates a vanilla "flat" overworld with OTG Nether and End using the "AlienJungle" and "Skylands" presets. 
# It also adds 2 dimensions using the "Wildlands" and "VanillaVistas" presets.
# Note: The NonOTGGeneratorSettings setting can be used to add a generator-settings JSON string for the "flat" overworld.
---
Version: 1
ModpackName: "My Awesome Modpack"
Overworld:
  NonOTGWorldType: "flat"
  NonOTGGeneratorSettings:
Nether:
  PresetFolderName: "AlienJungle"
End:
  PresetFolderName: "Skylands"
Dimensions:
- PresetFolderName: "Wildlands"
  Seed: 14
  PortalColor: "beige"
  PortalMob: "minecraft:zombified_piglin"
  PortalIgnitionSource: "minecraft:flint_and_steel"
  PortalBlocks: "minecraft:redstone_block"
- PresetFolderName: "VanillaVistas"
  Seed: 14
  PortalColor: "gold"
  PortalMob: "minecraft:zombified_piglin"
  PortalIgnitionSource: "minecraft:flint_and_steel"
  PortalBlocks: "minecraft:diamond_block"  
Settings:
  GenerateStructures: true
  BonusChest: false
GameRules:
  DoFireTick: true
  MobGriefing: true
  KeepInventory: false
  DoMobSpawning: true
  DoMobLoot: true
  DoTileDrops: true
  DoEntityDrops: true
  CommandBlockOutput: true
  NaturalRegeneration: true
  DoDaylightCycle: true
  LogAdminCommands: true
  ShowDeathMessages: true
  RandomTickSpeed: 3
  SendCommandFeedback: true
  SpectatorsGenerateChunks: true
  SpawnRadius: 10
  DisableElytraMovementCheck: false
  MaxEntityCramming: 24
  DoWeatherCycle: true
  DoLimitedCrafting: false
  MaxCommandChainLength: 65536
  AnnounceAdvancements: true
  DisableRaids: false
  DoInsomnia: true
  DrowningDamage: true
  FallDamage: true
  FireDamage: true
  DoPatrolSpawning: true
  DoTraderSpawning: true
  ForgiveDeadPlayers: true
  UniversalAnger: false
  # 1.21.1 rules — only specify rules you want to override (omitted = keep preset value)
  ProjectilesCanBreakBlocks: true   # Can projectiles (e.g. tridents) break blocks like pointed dripstone
  ReducedDebugInfo: false           # Hide coordinates and other debug info from F3 screen
  DoImmediateRespawn: false         # Skip death screen and respawn instantly
  FreezeDamage: true                # Players take damage from powdered snow freezing
  DoWardenSpawning: true            # Warden can spawn from sculk shriekers
  BlockExplosionDropDecay: true     # Block explosion drops decay randomly (not all blocks drop)
  MobExplosionDropDecay: true       # Mob explosion drops decay randomly
  TntExplosionDropDecay: false      # TNT explosion drops decay randomly
  WaterSourceConversion: true       # Flowing water can convert to source blocks
  LavaSourceConversion: false       # Flowing lava can convert to source blocks
  GlobalSoundEvents: true           # Sounds like bells and raid horns are heard globally
  DoVinesSpread: true               # Vines spread to adjacent blocks
  EnderPearlsVanishOnDeath: true    # Thrown ender pearls vanish when player dies
  MaxCommandForkCount: 65536        # Max number of forks for /execute
  CommandModificationBlockLimit: 32768  # Max blocks modified by /fill, /clone, etc.
  PlayersNetherPortalDefaultDelay: 80   # Ticks before nether portal teleports (survival)
  PlayersNetherPortalCreativeDelay: 1   # Ticks before nether portal teleports (creative)
  PlayersSleepingPercentage: 100    # % of players needed sleeping to skip night
  SnowAccumulationHeight: 1         # Max layers of snow that accumulate
  SpawnChunkRadius: 2               # Radius of spawn chunks (0-32)